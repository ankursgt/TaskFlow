<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Task Manager</title>

    <link
        rel="stylesheet"
        href="styles.css"
    >
</head>

<body>

    <header class="app-header">
        <div class="header-content">
            <h1>Task Manager</h1>
            <p>Manage your project tasks</p>
        </div>
    </header>


    <main class="app-container">
        <!-- Quick Add Task -->
         <section
            class="quick-add-section"
            aria-labelledby="quick-add-heading"
        >

            <h2 id="quick-add-heading">
                Quick Add Task
            </h2>

            <p class="section-description">
                Describe your task naturally and let the
                parser determine the title, priority and
                due date.
            </p>


            <form
                id="quick-add-form"
                novalidate
            >

                <!-- Description -->

                <div class="form-group">

                    <label for="quick-description">
                        Task Description
                    </label>

                    <textarea
                        id="quick-description"
                        name="description"
                        rows="4"
                        placeholder="Example: Finish the report next Friday, it's urgent"
                        required
                    ></textarea>

                    <span
                        id="quick-description-error"
                        class="error-message"
                        role="alert"
                    ></span>

                </div>


                <!-- Project -->

                <div class="form-group">
                    <label for="quick-project-id">
                        Project
                    </label>

                    <select
                        id="quick-project-id"
                        name="project_id"
                        required
                    >
                        <option value="">
                            Loading projects...
                        </option>
                    </select>

                    <span
                        id="quick-project-error"
                        class="error-message"
                        role="alert"
                    ></span>

                </div>


                <!-- Submit -->

                <button
                    type="submit"
                    id="quick-add-button"
                    class="primary-button"
                >
                    Parse &amp; Add Task
                </button>


                <!-- API Error -->

                <p
                    id="quick-add-error"
                    class="error-message"
                    role="alert"
                ></p>

            </form>

        </section>
        <!--Add Task -->
        <section
            class="task-form-section"
            aria-labelledby="add-task-heading"
        >
            <h2 id="add-task-heading">
                Add Task
            </h2>

            <form id="task-form" novalidate>

                <div class="form-group">
                    <label for="title">
                        Title
                    </label>

                    <input
                        type="text"
                        id="title"
                        name="title"
                        placeholder="Enter task title"
                        autocomplete="off"
                    >

                    <span
                        id="title-error"
                        class="error-message"
                        role="alert"
                    ></span>

                </div>

                <div class="form-group">
                    <label for="priority">
                        Priority
                    </label>

                    <select
                        id="priority"
                        name="priority"
                    >
                        <option value="low">
                            Low
                        </option>

                        <option
                            value="medium"
                            selected
                        >
                            Medium
                        </option>

                        <option value="high">
                            High
                        </option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="due-date">
                        Due Date
                    </label>

                    <input
                        type="text"
                        id="due-date"
                        name="due_date"
                        placeholder="e.g. next friday"
                    >
                </div>

                <!-- Project -->

                <div class="form-group">
                    <label for="project-id">
                        Project
                    </label>

                    <select
                        id="project-id"
                        name="project_id"
                        required
                    >
                        <option value="">
                            Loading projects...
                        </option>
                    </select>

                    <span
                        id="project-error"
                        class="error-message"
                        role="alert"
                    ></span>

                </div>


                <button
                    type="submit"
                    id="submit-button"
                    class="primary-button"
                >
                    Add Task
                </button>

            </form>
        </section>


        <section
            class="task-list-section"
            aria-labelledby="task-list-heading"
        >
            <div class="task-list-header">
                <h2 id="task-list-heading">
                    Tasks
                </h2>

                <span
                    id="task-count"
                    class="task-count"
                >
                    0 tasks
                </span>
            </div>
            <div
                id="task-list"
                class="task-list"
            >
            </div>

            <p
                id="empty-state"
                class="empty-state"
            >
                No tasks available.
            </p>
        </section>

    </main>


    <script src="app.js"></script>

</body>
</html>
